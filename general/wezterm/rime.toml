# Rime: Soft and muted pastels for long sessions.
# https://github.com/w0x7y/Rime

[colors]
foreground = "#c3ccd9"
background = "#23272e"
cursor_bg = "#c3ccd9"
cursor_fg = "#23272e"
cursor_border = "#c3ccd9"
selection_fg = "#dce2eb"
selection_bg = "#3a404b"
scrollbar_thumb = "#3a404b"
split = "#333842"
ansi = ["#3a404b", "#d98a9c", "#9ad8ac", "#e4d098", "#7aa4e4", "#bb98d6", "#7cc4d0", "#c3ccd9"]
brights = ["#6b768c", "#e1a4b2", "#b0e1be", "#eadaaf", "#97b8ea", "#caafdf", "#99d1da", "#f0f3f8"]

[colors.tab_bar]
background = "#1d2026"

[colors.tab_bar.active_tab]
bg_color = "#23272e"
fg_color = "#dce2eb"

[colors.tab_bar.inactive_tab]
bg_color = "#1d2026"
fg_color = "#6b768c"

[metadata]
name = "Rime"
author = "Idan Gilboa"
origin_url = "https://github.com/w0x7y/Rime"
