# Rime Aurora: Vivid neon accents on a darker background.
# https://github.com/w0x7y/rime

[colors]
foreground = "#c8d2e2"
background = "#1c1f25"
cursor_bg = "#c8d2e2"
cursor_fg = "#1c1f25"
cursor_border = "#c8d2e2"
selection_fg = "#e0e7f2"
selection_bg = "#333842"
scrollbar_thumb = "#333842"
split = "#2c3039"
ansi = ["#333842", "#ff6f91", "#5ef0a6", "#e6f07c", "#4fa2ff", "#9b7dff", "#38dce8", "#c8d2e2"]
brights = ["#6b768c", "#ff8fa9", "#81f3ba", "#ecf399", "#76b6ff", "#b19aff", "#64e4ed", "#f5f8fc"]

[colors.tab_bar]
background = "#17191e"

[colors.tab_bar.active_tab]
bg_color = "#1c1f25"
fg_color = "#e0e7f2"

[colors.tab_bar.inactive_tab]
bg_color = "#17191e"
fg_color = "#6b768c"

[metadata]
name = "Rime Aurora"
author = "Idan Gilboa"
origin_url = "https://github.com/w0x7y/rime"
