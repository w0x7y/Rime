# Rime Glacier: Crisper accents with clear separation between every syntax role, on a lighter background.
# https://github.com/w0x7y/rime

[colors]
foreground = "#c5cedd"
background = "#2a2f37"
cursor_bg = "#c5cedd"
cursor_fg = "#2a2f37"
cursor_border = "#c5cedd"
selection_fg = "#dfe5ee"
selection_bg = "#414854"
scrollbar_thumb = "#414854"
split = "#3a404b"
ansi = ["#414854", "#e07a90", "#88d8a0", "#e3dc9e", "#6eaaf0", "#ae94f0", "#6fd0d8", "#c5cedd"]
brights = ["#737e94", "#e797a8", "#a2e1b5", "#e9e4b3", "#8ebdf3", "#c0acf3", "#8fdae1", "#f3f6fa"]

[colors.tab_bar]
background = "#22272d"

[colors.tab_bar.active_tab]
bg_color = "#2a2f37"
fg_color = "#dfe5ee"

[colors.tab_bar.inactive_tab]
bg_color = "#22272d"
fg_color = "#737e94"

[metadata]
name = "Rime Glacier"
author = "Idan Gilboa"
origin_url = "https://github.com/w0x7y/rime"
