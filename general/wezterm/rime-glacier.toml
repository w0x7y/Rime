# Rime Glacier: Crisper accents with clear separation between every syntax role.
# https://github.com/w0x7y/Rime

[colors]
foreground = "#c5cedd"
background = "#23272e"
cursor_bg = "#c5cedd"
cursor_fg = "#23272e"
cursor_border = "#c5cedd"
selection_fg = "#dfe5ee"
selection_bg = "#3a404b"
scrollbar_thumb = "#3a404b"
split = "#333842"
ansi = ["#3a404b", "#e07a90", "#88d8a0", "#e3dc9e", "#6eaaf0", "#ae94f0", "#6fd0d8", "#c5cedd"]
brights = ["#6b768c", "#e797a8", "#a2e1b5", "#e9e4b3", "#8ebdf3", "#c0acf3", "#8fdae1", "#f3f6fa"]

[colors.tab_bar]
background = "#1d2026"

[colors.tab_bar.active_tab]
bg_color = "#23272e"
fg_color = "#dfe5ee"

[colors.tab_bar.inactive_tab]
bg_color = "#1d2026"
fg_color = "#6b768c"

[metadata]
name = "Rime Glacier"
author = "Idan Gilboa"
origin_url = "https://github.com/w0x7y/Rime"
