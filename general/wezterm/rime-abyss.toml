# Rime Abyss: The coldest take: no yellow or orange anywhere, with rose as the only warm accent.
# https://github.com/w0x7y/Rime

[colors]
foreground = "#c2cde0"
background = "#0f1218"
cursor_bg = "#c2cde0"
cursor_fg = "#0f1218"
cursor_border = "#c2cde0"
selection_fg = "#dde5f2"
selection_bg = "#212834"
scrollbar_thumb = "#212834"
split = "#1c222c"
ansi = ["#212834", "#e8879f", "#6fd0a8", "#9cf0dc", "#6b9cf4", "#937ff2", "#4fb4dc", "#c2cde0"]
