# Rime Abyss: The coldest take: no yellow or orange anywhere, with rose as the only warm accent.
# https://github.com/w0x7y/Rime

[colors]
foreground = "#c2cde0"
background = "#23272e"
cursor_bg = "#c2cde0"
cursor_fg = "#23272e"
cursor_border = "#c2cde0"
selection_fg = "#dde5f2"
selection_bg = "#3a404b"
scrollbar_thumb = "#3a404b"
split = "#333842"
ansi = ["#3a404b", "#e8879f", "#6fd0a8", "#9cf0dc", "#6b9cf4", "#937ff2", "#4fb4dc", "#c2cde0"]
