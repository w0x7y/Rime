# Rime Abyss: The coldest take, on a darker background: no yellow or orange anywhere, with rose as the only warm accent.
# https://github.com/w0x7y/Rime

[colors]
foreground = "#c2cde0"
background = "#15171c"
cursor_bg = "#c2cde0"
cursor_fg = "#15171c"
cursor_border = "#c2cde0"
selection_fg = "#dde5f2"
selection_bg = "#2c3039"
scrollbar_thumb = "#2c3039"
split = "#252830"
ansi = ["#2c3039", "#e8879f", "#6fd0a8", "#9cf0dc", "#6b9cf4", "#937ff2", "#4fb4dc", "#c2cde0"]
