name: check

on: [push, pull_request]

# the checks only read the repository
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing pushes, so the token isn't left in .git/config
      - name: Generated files are up to date
        run: python3 tools/build.py --check
      - name: Install Neovim
        # a fixed release, so a new Neovim can't change the results unannounced; bump both together
        env:
          NVIM_VERSION: v0.12.6
          NVIM_SHA256: 474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87
        run: |
          curl -fsSLo "$RUNNER_TEMP/nvim.tar.gz" "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_SHA256  $RUNNER_TEMP/nvim.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Tests
        env:
          RIME_REQUIRE_NVIM: "1"
        run: python3 -m unittest discover -s tools -v
